services:
  - type: web
    name: learnpython-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed
    startCommand: gunicorn learnpython.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
